# Tuned for AI training: many short-lived concurrent PHP requests.
# Each worker uses ~20-30MB RAM; 150 workers ≈ 3-4GB max.
<IfModule mpm_prefork_module>
    StartServers             30
    MinSpareServers          20
    MaxSpareServers          60
    MaxRequestWorkers       150
    MaxConnectionsPerChild 5000
</IfModule>
